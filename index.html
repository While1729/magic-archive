<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>群成员人格档案 · Persona 3 Reload</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='48' fill='%23121a2b' stroke='%23d4b26a' stroke-width='6'/%3E%3Ctext x='50' y='66' font-size='52' fill='%23d4b26a' text-anchor='middle' font-family='Georgia'%3EP3%3C/text%3E%3C/svg%3E">
<style>
:root{
  --gold:#d4b26a; --gold-hi:#f0d99a; --navy:#0d1526; --navy-2:#101c33;
  --ink:#e6ecf7; --muted:#9fb0cc; --line:rgba(212,178,106,.35);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#05070d;color:var(--ink);
  font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC","Source Han Sans SC",sans-serif;}
body{overflow:hidden}

/* ===== 舞台：固定 2560×1440，等比缩放 ===== */
#stage{position:fixed;inset:0;transform-origin:top left;}
.stage-inner{position:absolute;width:2560px;height:1440px;overflow:hidden;}

/* 背景：真实天鹅绒房间 */
#bg{position:absolute;inset:0;background:#05070d;}
#bg img{width:100%;height:100%;object-fit:cover;object-position:center;}
#bg .shade{position:absolute;inset:0;
  background:
    radial-gradient(120% 120% at 50% 42%, rgba(5,8,18,.18) 0%, rgba(4,6,12,.55) 70%, rgba(2,3,8,.82) 100%);}
/* 成员氛围光：切换成员时缓慢过渡（方案E+） */
#bg .glow{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity 1.8s ease;
  background:radial-gradient(75% 65% at 50% 36%, rgba(208,16,80,.42) 0%, rgba(208,16,80,0) 72%);}
#bg .glow.on{opacity:1;}

/* 左上标题字 */
#hdr{position:absolute;top:120px;left:130px;z-index:3;}
#hdr .zh{font-size:64px;font-weight:900;letter-spacing:6px;color:var(--gold-hi);
  text-shadow:0 4px 22px rgba(0,0,0,.7), 0 0 40px rgba(212,178,106,.25);}
#hdr .en{font-size:26px;letter-spacing:10px;color:var(--muted);margin-top:8px;
  text-transform:uppercase;text-shadow:0 2px 10px rgba(0,0,0,.6);}
#hdr .mon{display:inline-block;margin-top:22px;padding:6px 18px;border:1px solid var(--line);
  border-radius:999px;font-size:22px;letter-spacing:4px;color:var(--gold);
  background:rgba(13,21,38,.55);backdrop-filter:blur(2px);}

/* ===== 页签 ===== */
#tabs{position:absolute;top:210px;right:150px;z-index:4;display:flex;gap:10px;}
.tab{min-width:190px;padding:18px 34px;text-align:center;font-size:30px;letter-spacing:6px;cursor:pointer;
  border:1px solid var(--line);border-bottom:none;color:var(--muted);
  background:linear-gradient(180deg, rgba(18,28,52,.85), rgba(10,16,30,.85));
  clip-path:polygon(16px 0,100% 0,calc(100% - 16px) 100%,0 100%);
  transition:color .2s,background .2s;}
.tab.on{color:#0b1220;font-weight:900;background:linear-gradient(180deg,var(--gold-hi),var(--gold));
  text-shadow:none;}

/* ===== 左：大头像 + 名牌 ===== */
#portrait{position:absolute;left:120px;top:380px;width:1050px;height:880px;z-index:2;}
#portrait .frame{position:relative;width:640px;height:640px;margin:0 auto;}
#portrait .frame::before{content:"";position:absolute;inset:-16px;border:2px solid rgba(232,160,184,.5);
  transform:rotate(1.2deg);border-radius:10px;}
#portrait .frame img{width:100%;height:100%;object-fit:cover;border-radius:10px;
  border:2px solid rgba(232,160,184,.55);box-shadow:0 30px 80px rgba(0,0,0,.6);cursor:zoom-in;}
#portrait .frame .ta{position:absolute;left:50%;top:-48px;transform:translateX(-50%);
  font-size:22px;letter-spacing:5px;color:var(--gold);background:rgba(10,16,30,.7);
  padding:4px 18px;border:1px solid var(--line);border-radius:999px;white-space:nowrap;}

/* 名牌：名字主角化（无盒无裁切，大字号直排） */
#nameplate{width:100%;margin:34px auto 0;position:relative;text-align:center;}
#nameplate .nm{display:block;font-size:96px;font-weight:900;color:var(--gold-hi);
  letter-spacing:6px;line-height:1.08;white-space:nowrap;
  text-shadow:0 6px 24px rgba(0,0,0,.85),0 0 60px rgba(212,178,106,.28);}
#nameplate .meta{margin-top:16px;display:flex;align-items:center;justify-content:center;gap:26px;}
#nameplate .no{font-size:22px;letter-spacing:4px;color:var(--gold);white-space:nowrap;
  border:1px solid rgba(212,178,106,.4);padding:4px 14px;border-radius:999px;background:rgba(8,13,26,.5);}
#nameplate .qq{font-size:24px;color:var(--muted);letter-spacing:2px;white-space:nowrap;}
#nameplate .cnt{display:flex;align-items:baseline;gap:8px;white-space:nowrap;}
#nameplate .cnt .n{font-size:34px;font-weight:900;color:var(--gold);}
#nameplate .cnt .l{font-size:18px;color:var(--muted);letter-spacing:2px;}

/* ===== 右：观察月报面板（P3R 真实对话框底） ===== */
#panel{position:absolute;right:150px;top:300px;width:760px;height:920px;z-index:2;
  background:linear-gradient(180deg, rgba(56,2,20,.96) 0%, rgba(30,0,10,.97) 55%, rgba(18,0,6,.98) 100%);
  border:1px solid rgba(232,120,160,.35);border-top:5px solid rgba(208,16,80,.9);
  box-shadow:0 30px 90px rgba(0,0,0,.55);}
#panel .info{position:absolute;top:30px;left:26px;width:150px;opacity:.95;pointer-events:none;}
#panel .cor{position:absolute;right:26px;bottom:22px;width:118px;opacity:.55;pointer-events:none;}
#panel .phd{padding:34px 34px 16px 196px;border-bottom:1px solid rgba(232,120,160,.18);
  display:flex;align-items:baseline;justify-content:space-between;gap:12px;}
#panel .phd .t{font-size:30px;letter-spacing:6px;color:var(--gold-hi);font-weight:900;white-space:nowrap;}
#panel .phd .s{font-size:20px;color:#c9a8b4;letter-spacing:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
#panel .tagline{display:block;padding:18px 34px 6px 196px;font-size:24px;color:#f0c8d4;
  font-style:italic;letter-spacing:1px;}
#panel .body{position:absolute;top:178px;left:0;right:0;bottom:0;padding:10px 34px 40px;overflow-y:auto;}
#panel .body::-webkit-scrollbar{width:10px}
#panel .body::-webkit-scrollbar-thumb{background:rgba(232,120,160,.45);border-radius:6px}
#panel .body::-webkit-scrollbar-track{background:rgba(255,255,255,.04)}
#panel .body p{margin:0 0 20px;line-height:1.85;font-size:26px;color:#f4e3ea;
  font-family:"Songti SC","Noto Serif SC","SimSun",serif;text-align:justify;}
#panel .body p.mo{font-size:24px;color:#cfa8b6;}

/* ===== 中部速览卡（互动 Top3 · 档案完整度 · 典型证词） ===== */
#dossier{position:absolute;left:1010px;top:300px;width:620px;height:920px;z-index:2;
  display:flex;flex-direction:column;
  background:linear-gradient(180deg,#2c0212 0%,#1a0009 55%,#12000a 100%);
  border:1px solid rgba(232,120,160,.22);border-top:5px solid rgba(208,16,80,.85);
  border-radius:6px;overflow:hidden;box-shadow:0 10px 40px rgba(0,0,0,.45);}
#dossier .ds-head{display:flex;align-items:baseline;gap:14px;padding:22px 26px 16px;
  border-bottom:1px solid rgba(232,120,160,.16);}
#dossier .ds-head .t{font-size:27px;letter-spacing:5px;color:var(--gold-hi);font-weight:900;white-space:nowrap;}
#dossier .ds-head .s{font-size:16px;color:#9a7a8a;letter-spacing:2px;}
#dossier .ds-sec{padding:20px 26px 6px;}
#dossier .ds-t{font-size:19px;color:#d9a8b8;letter-spacing:3px;margin-bottom:12px;font-weight:700;}
#dossier .ds-t::before{content:"◆ ";color:rgba(208,16,80,.9);font-size:14px;}
#top3row{display:flex;flex-direction:column;gap:10px;}
.top3it{display:flex;align-items:center;gap:14px;padding:8px 14px;
  background:rgba(208,16,80,.06);border:1px solid rgba(232,120,160,.18);border-radius:8px;}
.top3it .a{width:52px;height:52px;border-radius:8px;overflow:hidden;flex:0 0 52px;
  border:1px solid rgba(232,160,184,.45);}
.top3it .a img{width:100%;height:100%;object-fit:cover;}
.top3it .nm{flex:1;min-width:0;font-size:22px;color:#f7dfe7;font-weight:700;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.top3it .w{font-size:19px;color:var(--gold);white-space:nowrap;}
.top3it .w b{font-size:24px;}
#dsConfWrap{display:flex;align-items:center;gap:26px;padding:6px 10px 16px;}
#dsConfRing{flex:0 0 auto;}
#dsConfSide{flex:1;min-width:0;}
#dsConfSide .num{font-size:44px;color:var(--gold-hi);font-weight:900;line-height:1;}
#dsConfSide .cap{font-size:17px;color:#b08a9a;margin-top:8px;line-height:1.5;letter-spacing:1px;}
#dsQuote{border-top:1px solid rgba(232,120,160,.16);margin-top:4px;padding:20px 26px 24px;flex:1;min-height:0;
  display:flex;flex-direction:column;}
#dsQuote .q{font-size:25px;line-height:1.7;color:#f4e3ea;text-align:justify;
  font-family:"Songti SC","Noto Serif SC","SimSun",serif;overflow:hidden;}
#dsQuote .q::before{content:"“";color:rgba(208,16,80,.9);font-size:36px;line-height:0;vertical-align:-8px;margin-right:4px;}
#dsQuote .q::after{content:"”";color:rgba(208,16,80,.9);font-size:36px;line-height:0;vertical-align:-10px;margin-left:4px;}
#dsQuote .src{margin-top:14px;font-size:16px;color:#8a6a7a;letter-spacing:1px;}

/* ===== 底部槽位条（P3R 队伍面板真实底） ===== */
#strip{position:absolute;left:0;right:0;bottom:0;height:196px;z-index:2;
  background:
    linear-gradient(180deg, rgba(10,2,8,.78) 0%, rgba(6,0,4,.9) 100%),
    url(assets/p3r/strip_bg.webp) center / cover no-repeat;
  border-top:1px solid rgba(232,120,160,.35);padding:26px 190px 22px;}
#strip .row{display:flex;gap:14px;height:150px;align-items:center;}
.slot{flex:0 0 138px;height:150px;cursor:pointer;position:relative;text-align:center;
  border:1px solid rgba(232,160,184,.28);background:rgba(16,4,12,.42);
  border-radius:12px;transition:.15s;}
.slot.on{border-color:rgba(240,200,212,.9);background:linear-gradient(180deg,rgba(64,8,28,.8),rgba(26,2,12,.9));}
.slot .a{margin:14px auto 8px;width:72px;height:72px;border-radius:10px;overflow:hidden;
  border:1px solid rgba(232,160,184,.5);}
.slot .a img{width:100%;height:100%;object-fit:cover;}
.slot .n{font-size:20px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  padding:0 6px;}
.slot.on .n{color:#f7dfe7;font-weight:800;}
.slot .pg{position:absolute;top:-14px;right:8px;font-size:18px;color:#f0c8d4;}
#credit{position:absolute;right:24px;bottom:8px;z-index:3;font-size:15px;color:rgba(240,200,212,.4);
  letter-spacing:1px;pointer-events:none;}
/* 翻页箭头 */
#pprev,#pnext{position:absolute;bottom:96px;z-index:3;width:74px;height:96px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;color:var(--gold);
  border:1px solid var(--line);background:rgba(8,13,26,.6);font-size:40px;font-weight:900;}
#pprev{left:52px}#pnext{right:52px}
#pprev:hover,#pnext:hover{background:rgba(30,44,74,.8);color:var(--gold-hi)}
#pprev.dis,#pnext.dis{opacity:.25;pointer-events:none}

/* 成员左右切换 */
#larr,#rarr{position:absolute;top:880px;z-index:4;width:88px;height:120px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;font-size:52px;font-weight:900;
  color:var(--gold);border:1px solid var(--line);background:rgba(8,13,26,.5);
  transition:.15s;}
#larr:hover,#rarr:hover{background:rgba(30,44,74,.75);color:var(--gold-hi)}
#larr{left:16px}#rarr{right:16px}

/* 弹窗 */
#modal{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;
  background:rgba(2,4,8,.85);backdrop-filter:blur(4px);}
#modal.show{display:flex}
#modal .card{position:relative;max-width:78vw;max-height:86vh;border:2px solid var(--gold);
  background:#0a1120;padding:10px;box-shadow:0 40px 120px rgba(0,0,0,.8);}
#modal img{display:block;max-width:76vw;max-height:80vh;object-fit:contain;}
#modal .nm{margin-top:12px;text-align:center;font-size:26px;color:var(--gold-hi);letter-spacing:3px;}
#modal .x{position:absolute;top:-24px;right:-24px;width:52px;height:52px;border-radius:50%;cursor:pointer;
  background:var(--navy-2);border:1px solid var(--gold);color:var(--gold);font-size:30px;line-height:1;}

/* toast */
#toast{position:fixed;left:50%;bottom:40px;transform:translateX(-50%);z-index:60;
  padding:14px 28px;font-size:24px;color:var(--gold-hi);background:rgba(8,13,26,.92);
  border:1px solid var(--line);border-radius:999px;opacity:0;pointer-events:none;transition:.3s;}
#toast.show{opacity:1}

/* 关系页：力导向图谱 */
.view{display:none}
.view.show{display:block}
#rel{position:absolute;left:150px;right:150px;top:300px;bottom:210px;z-index:3;
  display:none;flex-direction:column;
  background:linear-gradient(180deg,rgba(56,2,20,.92),rgba(16,0,8,.96));
  border:1px solid rgba(232,120,160,.35);border-top:5px solid rgba(208,16,80,.9);
  box-shadow:0 30px 90px rgba(0,0,0,.55);}
#rel.show{display:flex}
#rel .rt{display:flex;align-items:center;justify-content:space-between;padding:14px 26px;
  border-bottom:1px solid rgba(232,120,160,.2);}
#rel .rt .t{font-size:28px;color:var(--gold-hi);letter-spacing:6px;font-weight:900;}
#rel .rt .s{font-size:20px;color:#c9a8b4;letter-spacing:1px;}
#rel #graphCanvas{flex:1;width:100%;display:block;cursor:pointer;}
#rel #relDetail{padding:12px 26px 14px;border-top:1px solid rgba(232,120,160,.2);
  font-size:22px;line-height:1.6;color:var(--ink);min-height:64px;}
#rel #relDetail .hi{color:#f7dfe7;font-weight:800;}

@media (max-width:900px){
  #tabs{right:40px;top:26px}
  .tab{min-width:110px;padding:10px 16px;font-size:18px;letter-spacing:2px}
}
</style>
</head>
<body>
<div id="stage"><div class="stage-inner" id="stageInner">
  <div id="bg">
    <img src="assets/velvet_room.jpg" alt="" decoding="async">
    <div class="shade"></div>
    <div class="glow" id="glow1"></div>
    <div class="glow" id="glow2"></div>
  </div>

  <div id="hdr">
    <div class="zh">群成员人格档案</div>
    <div class="en">MAGICAL FACTOR PARLIAMENT ARCHIVE</div>
    <div class="mon" id="monLabel">观察月报 · 2026-09</div>
  </div>

  <div id="tabs">
    <div class="tab on" data-v="profile">档案</div>
    <div class="tab" data-v="relation">关系</div>
  </div>

  <div id="portrait">
    <div class="frame">
      <div class="ta" id="taLabel">魔女因子议会 · 成员</div>
      <img id="bigAvatar" src="" alt="成员头像" decoding="async">
    </div>
    <div id="nameplate">
      <div class="nm" id="memName">—</div>
      <div class="meta">
        <div class="no">NO.000 / 26</div>
        <div class="qq" id="memQQ">QQ · —</div>
        <div class="cnt"><div class="n" id="msgCount">0</div><div class="l">条发言</div></div>
      </div>
    </div>
  </div>


  <div id="dossier">
    <div class="ds-head"><div class="t">档案速览</div><div class="s">DOSSIER · 实时演算</div></div>
    <div class="ds-sec">
      <div class="ds-t">互动最多</div>
      <div id="top3row"></div>
    </div>
    <div class="ds-sec">
      <div class="ds-t">档案完整度</div>
      <div id="dsConfWrap">
        <div id="dsConfRing"></div>
        <div id="dsConfSide">
          <div class="num" id="dsConfNum">—%</div>
          <div class="cap" id="dsConfCap">基于近月语料抽样观察</div>
        </div>
      </div>
    </div>
    <div id="dsQuote">
      <div class="ds-t">典型证词</div>
      <div class="q" id="dsQuoteText">—</div>
      <div class="src" id="dsQuoteSrc">群内原始发言摘录</div>
    </div>
  </div>

  <div id="panel">
    <img class="info" src="assets/p3r/info_badge.webp" alt="INFO" decoding="async">
    <img class="cor" src="assets/p3r/corner_badge.webp" alt="" decoding="async">
    <div class="phd"><div class="t" id="phTitle">观察月报</div><div class="s" id="phSub">成员 · 2026-09</div></div>
    <span class="tagline" id="tagline">—</span>
    <div class="body" id="panelBody"></div>
  </div>

  <div id="rel">
    <div class="rt">
      <div class="t">群员关系图谱</div>
      <div class="s">回复 × 提及 · 互动频度连线 · 点击节点查看</div>
    </div>
    <canvas id="graphCanvas"></canvas>
    <div id="relDetail">点击节点查看该成员的群内互动</div>
  </div>

  <div id="larr">‹</div>
  <div id="rarr">›</div>
  <div id="pprev">«</div>
  <div id="pnext">»</div>
  <div id="strip"><div class="row" id="slotRow"></div></div>
  <div id="credit">UI 素材出自《女神异闻录3 Reload》（©ATLUS），仅供非商用致敬</div>
</div></div>

<div id="modal"><div class="card"><button class="x" id="modalX">×</button><img id="modalImg" alt=""><div class="nm" id="modalNm"></div></div></div>
<div id="toast"></div>

<script>
/* ============ 数据（由档案生成结果注入） ============ */
const GROUP_DATA = {"name":"魔女因子议会","groupId":"941270434","summaryMonth":"2026-09","members":[{"id":"525119253","name":"-","color":"#d4b26a","tagline":"群里的产粮永动机，玛奈CP点子王","messageCount":14809,"paragraphs":["观察总结：群里的消息巨鲸，一万四千多条压得第二名看不见尾灯。此人开口基本只有两种状态：要么通宵给你连载一整个校园PA、蝶枪PA、吸血鬼PA的长篇点子，把玛格和奈叶香的恋爱扭成麻花再掰开揉碎；要么半夜三点冒一句「有人聊天吗」然后开始发癫。自称水群最多是真的——熬到昏睡过去、智齿天天疼还边做饭边锐评2-3，脑内有一座永不停工的同人兵工厂。","观察标签：玛奈CP原教旨主义者 / 通宵产粮永动机 / 失眠型创作者 / 全吃派 / 自学杂家 / 嘴硬心软的玛格辩护人 / 猫语使用者","说话方式：一句话常拆成七八条短消息往外蹦，句尾挂「喵」，卡壳就甩#蠕动#躺#大哭，聊嗨了会自己跟自己对话式地讲故事，括号里塞满舞台提示；兴趣线索：魔裁全员尤其玛格×奈叶香，顺带设计自创魔法体系、红楼梦菜品复刻、自学音乐、攻击英国料理；群内互动：见谁聊得来就追着喂点子，管同好叫「老大」，卡文时骂自己「果然我是条蛆」，转头又爬起来说「我再写两篇吧」。","典型证词：「对，我是水群最多的」——被问谁最活跃时坦然认领，属实至名归；「你可以说玛格这个人不正经，但是你不能说她干的事不正经」——为玛格辩护的金句，护崽护得理直气壮；「果然我是条蛆。」——卡文到一半的深夜自我贬低，下一句又默默爬起来继续写。","数据口径：本语料截取最近1200条，覆盖2026-08-29至2026-09-24。发言密度高、主题集中，形象相当立体；唯因仅取近一个月，早期性格演化无从对照。观察可信度：85%。"],"avatar":"assets/avatars/525119253.jpg"},{"id":"1692008521","name":"杂碎木屑","color":"#aec6e8","tagline":"群里的烤肉苦力，社恐的化竞退学生","messageCount":4276,"paragraphs":["这位是群里消息量最大的苦力型群友，四千多条消息里一半在烤肉嵌字、一半在跟人唠CP。初中化竞出身，上了一年就早早休学，自称\"小资历\"，魔裁是他打的第一部视觉小说，却被白杨老师那篇玛格万字解析一把捶进圈。日常在群里烤朗读剧切片、嵌字、等亚里沙MV一出就自己上手工翻译歌词，还建了群相册《留守组》替大家整理散粮。嘴上挂着\"想躺平没力气\"\"社交无能\"，实际却主动拉人、帮人翻聊天记录、给新人答疑，是群主之外事实上的管理员。","观察标签：烤肉民工 / 艾希樱蝶混邪杂食 / 前化竞退学生 / 社恐但热心 / 渣日语自翻党 / 群管理隐形人 / 情绪内耗型","说话方式：句子短而碎，爱用括号打补充（），句尾飘\"喵\"\"好喔\"\"w\"，正经分析时突然长句连发又自嘲\"语言组织能力好烂\"；兴趣线索：魔裁全角色CP都能聊，偏爱艾玛软糯、安安母女感，对梦限大动画边骂边追，星空列车与樱之诗等视觉小说照单全收；群内互动：谁发二创都第一个接话，谁emo就\"摸摸\"，见到画师太太想私信又不敢，跟Hikari是固定唠嗑搭子，对群主3sinL一口一个\"摸摸群主w\"。","典型证词：「我以前是化竞的 可惜只上了一年初中就早早休学了 原因大家应该也知道」——自己揭老底时语气平淡，像在念别人的事；「真正把我捶死在这个圈的 大概就是白杨老师的那篇玛格万字解析了吧」——一句话交代了自己入坑原点，也解释了他后来为什么拼命烤肉回报社区；「想躺平 不想动 没力气 感觉精力不足以听点子和看东西 更别提创作什么了」——躺平宣言后面紧跟着就烤了个十分钟朗读剧切片，属于是身体很诚实地在为爱发电。","书记官备注：本文件抽取该成员1200条发言，覆盖2026-08-17至2026-09-24约五周，占其总消息4276条的约28%。发言密度高、话题跨度大，性格与爱好描摹较稳，但早年经历与家庭细节仅一笔带过，未做深挖。观察可信度：82%。"],"avatar":"assets/avatars/1692008521.jpg"},{"id":"975953069","name":"豌豆鸮","color":"#8fd0a0","tagline":"社恐文学社社长，写推理的黑塞信徒","messageCount":3652,"paragraphs":["一位在政治地理特色高中读纯理（物化生）的高中生，生物是命，英语是坎，晚上被爹妈收手机，在学校里自认「隐身人」。线上却是文学社/小说社社长，招新讲课都社恐，却埋头写推理小说，《魔法少女的伊甸禁果》第一案案发写完，七夕还会肝一篇冰月限定。文学口味偏黑塞，魔裁里是死忠冰月党，最喜欢的角色总被骂也照单全收。情绪上敏感内耗，头疼、疲惫、自我怀疑常挂嘴边，对群友却永远一句「摸摸」「晚安哦」。","观察标签：高中生/物化生 / 文学社社长 / 推理小说自炊 / 黑塞信徒 / 冰月党 / 社恐线上社交 / 温柔安慰役","说话方式：短句为主，「嗯」「没事」「摸摸」「晚安哦」循环，爱发固定奶蛙表情包（据他说是小说组里别人用AI做的自己角色的表情包），句尾偶尔带「喵」，真聊创作时才放开谈叙诡与潜意识伏笔；兴趣线索：黑塞与《荒原狼》、悲惨世界、米德尔马契、红与黑、推理小说、魔裁冰月CP、生化与医学志愿；群内互动：给群友的小说写读后感、参与新春会剧本、督促拖延症群友干活，自陈「我不理人一般只是我没空在干别的」，被问心理状况时会坦诚分享自己的侵入式臆想。","典型证词：「还是最喜欢黑塞」——书单一句话定调，黑塞是他文学宇宙的原点；「玩魔裁以后最喜欢的两个角色总是被骂。不过喜欢不需要在乎别人的看法吧，不然就只是无意义的虚伪了」——被群嘲也不换推，温柔但轴；「我不理人一般只是我没空在干别的呢」——解释自己的忽冷忽热，社恐的人反而最会替别人找台阶。","书记官备注：基于合并新语料1200条成文，覆盖2026-08-03至2026-09-23，群内消息总数3652；发言以短句加图片为主，文本密度中等，学业、创作、心理三类线索交叉互证。观察可信度：82%。"],"avatar":"assets/avatars/975953069.jpg"},{"id":"964253089","name":"超高校级的潜意识","color":"#e0a67a","tagline":"安安厨，写到第一百多章的同人作者","messageCount":3326,"paragraphs":["观察总结：群里正经连载同人长篇的那一位，id自带「超高校级」，人也确实当得起——写了一百多章的梦灯花世界观长篇，七夕发《永远的彩虹》，还能为诺亚一首小曲查日语辞源逐条考据。表面是福建某经管院工科大学生、桥牌体育课摸鱼、洛克人打榜全国两百，内里是个把自己劈成「内核诺亚、活成安安」的安安厨，外加东方古明地恋的纯良恋厨。说话爱带（），抢话抢得自己都惊呼「我是抢话大王」。","观察标签：安安厨 / 长篇同人作者 / 日语考据党 / 东方恋厨 / 全能玩家 / 来者皆是客 / 自我投射型创作","说话方式：分析时句子绵密、爱摆一二三分点，日常聊天句句挂（），抢话飞快，被人指出来还会自嘲「我去，我是抢话大王」；兴趣线索：魔裁同人尤其安安×诺亚、星空列车与ATRI、弹丸论破、塞尔达王泪、鸣潮、东方恋恋、国产推理安利；群内互动：主动给人安利同人、给作者写长评、秉持给所有评论点赞回复的原则，也会半夜翻自己旧文给自己写解析。","典型证词：「我内核有点诺亚，但是因为各种原因活成了安安的样子，安安的占比也更多一些」——一句话交代自我投射；「我大学期间有意把自己变成 想做就去做的 这种样子，所以才开始写同人文了」——写文契机的自白；「我秉持来者皆是客的原则，有给我评论的都会点赞，有写感受的都会回复」——温吞但周到的待人之道。","数据口径：本语料截取最近1200条，覆盖2026-08-08至2026-09-24。发言量大、自我披露充分，创作观与圈子生态记录详尽；唯作者自陈「不混社区」，部分判断偏个人向。观察可信度：82%。"],"avatar":"assets/avatars/964253089.jpg"},{"id":"1943836001","name":"是林珑姐姐呀","color":"#9fb4e8","tagline":"拷打a社的重构党，嵌字搬图话痨考据","messageCount":3241,"paragraphs":["群里的剧情重构发动机兼嵌字搬运工，自称「我负责发涩图和每日拷打a社」。P站画师id张口就来，魔裁同人嵌字从mll开始盯着全员更新，还自己搓魔裁痛枪涂装mod，为RGB码求人、拖花拖到「差点给我拖似了」。最惊人的是9月24日深夜一条龙输出自己的魔裁if重构：梅露露劝住艾玛紫砂、牢雪脑控魔女岛高层、参考石头门魔圆的世界线因果，「用改动最小的方式让剧情合理化」。炸群、串子、营销号偷帖门儿清，对新人主动开课科普，打字快到自称抢话大王。","观察标签：魔裁考据党 / 剧情重构if / 嵌字搬运 / 痛枪涂装mod / 长评写手 / 社区生态观察者 / 话痨输出役","说话方式：长句密集、转发引用成堆，「（」「难蚌」「申必」「彳亍」「byd」口癖一串，一旦进入重构模式就连发十几条停不下来，「输出，都可以输出」「聊到哪算哪」；兴趣线索：魔裁全14人剧情线、艾希橘远诺安冰雪枪骨官派CP、P站同人、黑盒贴吧长评、痛枪涂装、石头门魔圆式世界线设定；群内互动：给新人做剧情科普、和人OC对线魔法强化设定、审核群拉人、对B站营销号连话都抄走一事苦笑通透，收尾还会叮嘱「夏秋之交群友们也注意身体啊」。","典型证词：「我负责发涩图和每日拷打a社」——一句话自封群务，又损又准；「我想把整体魔女岛的背景改掉，改成牢雪报完仇没杀爽脑控一批高层玩i人tv」——世界观魔改张口就来，比官方还顺；「虽然我也是无授权转载但是他连我话都抄走了确实有点难绷」——自己搬图又被营销号搬，链路闭环的苦笑。","书记官备注：基于合并新语料1200条成文，覆盖2026-08-11至2026-09-25，群内消息总数3241；长文本与转发引用极多，观点鲜明、立场可辨，重构方案自述完整自洽。观察可信度：85%。"],"avatar":"assets/avatars/1943836001.jpg"},{"id":"3476306475","name":"手机被占","color":"#7ec8e3","tagline":"满屏[[盯]]的脑补帝，温柔贴贴跑团新人","messageCount":2964,"paragraphs":["昵称本身就是一句状态报告。群里的if线供应商兼情绪贴贴机：半夜做梦都能爬起来分享nnk丢手机引发的连锁诡计，给诺安设计成步堂×真宵、福尔摩斯×华生式的未来关系，连诺亚希罗互换房间让安安艾玛自然相处这种润滑剂点子都想得出来。正在群里偷师描写手法，自谦脑内画面太多「像哼歌一整首嘴只能哼出一条音轨」。弹丸二刚通关，跑团群进了又后悔，社恐想扮阴角。发言被[[动成语音]]占领，满屏[[盯]][[吓唬]][[戳戳]]，是群里的毛绒玩具。","观察标签：if线脑洞供应商 / 描写技巧学习者 / 弹丸论破玩家 / TRPG跑团新人 / 温柔贴贴役 / 诺安脑 / 动成语音重度用户","说话方式：文本消息短而碎，靠[[盯]][[看戏]][[趴]][[猫猫生的]]这类动成语音刷屏表达情绪，「戳戳」「摸摸」「笨蛋」「给你马杀鸡」连珠，认真讨论剧情时才会拉长句；兴趣线索：魔裁诺安CP、if线与核心诡计、感官描写与漫画分镜、奥伯拉丁的回归、弹丸二代、极乐迪斯科与安科；群内互动：和长歌仪梦私聊转发互通游戏进度，群友陷入自我怀疑时温言安抚（「正常心理，侵入式想法或者情绪释放，两种解释自己选吧」），自称「我负责摸鱼」。","典型证词：「有人想写案件的话也许可以参考一下，我感觉这个想法作为核心诡计还是挺不错的」——梦里爬起来送诡计，if线供血站；「就像哼歌时，脑子里是一整首但嘴只能哼出一条音轨一样」——自陈创作瓶颈，比喻精准得让人心疼；「我有点后悔进跑团群了」——社恐误入热闹现场的经典台词。","书记官备注：基于合并新语料1200条成文，覆盖2026-08-11至2026-09-25，群内消息总数2964；动成语语音占比高，纯文本发言多为脑补、学习与情绪安慰，性格线索稳定。观察可信度：80%。"],"avatar":"assets/avatars/3476306475.jpg"},{"id":"842419765","name":"Hikari（已回归）","color":"#c9a45c","tagline":"自称吾辈的安安护卫队长","messageCount":2923,"paragraphs":["这位是群里旗帜最鲜明的安安厨，说话全程自称\"吾辈\"——学的就是夏目安安的口癖，自己也承认\"语c的时候带双引号就是安安人格顶号了\"。因为看了群主3sinL那篇骂安安的视频反而被反向吸引，入坑后一头扎进为安安正名的事业：写《假如假死成功》同人、写艾安解析、在小黑盒和B站连发长文，跟骂安安的玩家对线到心累。定期\"回归\"——平时要上学，回来就疯狂发电。情绪起伏极大，一边喊\"安安酱全身上下都是可爱的地方\"，一边又坦白\"吾辈很害怕被人讨厌\"\"很想被人在乎\"。","观察标签：安安单推 / 吾辈口癖 / 同人作者 / 角色辩护者 / 定期回归学生党 / 艾安CP人 / 情绪化发电","说话方式：每句几乎都带\"吾辈\"，句尾常加desu/desuwa，正经分析时逻辑链拉得很长，情绪上来就小作文连发；兴趣线索：魔裁只推安安，顺带磕诺安、艾安，对梅露露从讨厌转回暖，喜欢软糯幼态角色，对涩图有自成一套的\"角色特色\"品鉴标准；群内互动：追着群友求看自己的解析、发了文就回来翻评论数，被夸就\"谢谢夸奖\"，没人理就\"难道吾辈冷掉了吗\"，跟杂碎木屑是互相鼓励的创作搭子，对群主3sinL又敬又谢。","典型证词：「吾辈也很想要一个能一直牵挂着吾辈的人，毕竟吾辈很想被人在乎」——这句真心话比任何角色分析都更接近他自己；「恕我直言，那些玩家才是真正的恶棍」——替安安出头时火力全开，丝毫不给自己留余地；「其实吾辈要感谢群主的那篇安安评价 如果没有那篇评价，吾辈或许并不会深入的了解安安酱，也就不会结识你们」——一句话交代了自己入群的完整因果链，也解释了他为什么对3sinL始终抱着感恩。","书记官备注：本文件抽取该成员1200条发言，覆盖2026-08-01至2026-09-25近两个月，占其总消息2923条的约41%。其发言高度集中在安安一个角色上，其他话题涉猎较少，故对其课外生活、现实社交的判断偏薄。观察可信度：78%。"],"avatar":"assets/avatars/842419765.jpg"},{"id":"2170274595","name":"3sinL","color":"#e8d4a0","tagline":"群主兼UP，颜文字驱动的技术宅","messageCount":2373,"paragraphs":["这位就是群主本人，B站那边挂着个做魔裁角色分析和密码学科普的小UP，群里这群魔裁同好基本都是他一个个拉进来的。高中数竞出身，被学校整出重度抑郁后在家高考，现在读计算机，上课学bash和物理实验，下课学AE剪视频、学Obsidian做笔记。闲不住——在群里接机器人插件、自己捏了安安和诺亚两个AI bot来玩，聊到一半就跑去调代码。管理风格是放养：\"拉人我都默许的\"\"出问题再加群规就行\"。颜文字不离手，(๑•̌.•̑๑)ˀ̣ˀ̣、o(^▽^)o 满天飞，嘴上说\"群主没做什么实事\"，实际群数据统计、群头衔、群相册全是他一手搭起来的。","观察标签：群主/UP主 / 计算机在读 / 数竞退学生 / AI bot捏师 / 颜文字狂魔 / 视频制作中 / 放养式管理","说话方式：句子里插着大量颜文字和括号碎碎念，聊技术时简洁利落，聊生活时温柔鼓励，口头禅\"总之我爱你们❤️\"；兴趣线索：JRPG老饕（空轨断档式领先、神之天平、野炊王泪）、宝可梦对战曾打进世界前十、密码学和逆向工程、魔裁服装解析、计划做东方和时之笛直播；群内互动：谁发作品都第一时间去看并给反馈，鼓励群友\"先开始再说\"，对Hikari的文、-老师的文都认真给修改意见，跟杂碎木屑互相摸摸，偶尔深夜emo说\"精力被大学耗尽了\"。","典型证词：「我高中直接被整休学了 后来在家高考的 把我搞出来一个重度抑郁 在医院拿了证明，才休学了」——轻描淡写一句带过，背后是另一段没人细问的故事；「总而言之要先有个开始 才能有后续不断地提高质量」——这是他劝群友做内容时最常说的话，也是他自己做视频的信条；「颜文字真的是程序员最好的朋友了」——一句话把他为什么在群里天天发颜文字交代得明明白白。","书记官备注：本文件抽取该成员1200条发言，覆盖2026-07-27至2026-09-24近两个月，占其总消息2373条的约51%。作为群主其发言覆盖面广、技术细节与生活自述均有，但部分敏感话题（政治、心理状态）主动收束，未做追问。观察可信度：85%。"],"avatar":"assets/avatars/2170274595.jpg"},{"id":"3610789724","name":"长歌仪梦","color":"#8a9ec4","tagline":"边疼智齿边写学姐前传的热心新人","messageCount":1943,"paragraphs":["群里最后一个报到的新人，09-16才冒头，却像住了半年：一进来就给自己的魔女团排兵布阵，给冰上梅露露、千叶奈奈可、樱田遥一个个安上［治愈］［还原］［气味］这类魔法名，连代价和进化线都顺手设计好。他真正在写的是一部叫《遗案卷宗》的前传同人，梅露露当暗线、奈叶香打头阵，序章两千五，用手机云端备忘录一章章磨。不知不觉接住了群里那位温柔耐心的「大叔」人设，一口一个「大叔听着呢」，群友病了就摸摸头催睡觉，还自掏腰包先建了《美图杂图》和《梗图》两个相册。后台是个早八连连、嘴里横躺三四颗智齿、下雨天还要去给室友送伞的大学生，热情得像要把缺席的时间一次补回来。","观察标签：最后入群的新人 / 大叔厨 / OC魔法设定狂 / 遗案卷宗前传作者 / 猫口癖喵呜唔 / 早八智齿大学生 / 群相册热心管理员","说话方式：想法从来不爱攒成一句，一条拆成三四条短炮往外蹦，句尾挂着「喵？」「唔」「嘶」「艹」；一聊到魔法设定就切进严谨模式，把能力、表现、进化、禁忌分条列清，还会较真「因为魔法是魔女们的东西，我反而在避免近代词汇」。兴趣线索：原作刚通关就反向做前传，东方今年才入坑就买了和生日同一天的新典，UT、第五人格、邦邦、逆转裁判杂食，约了立绘在等画师排单。群内互动：主动给生病的群友递汉堡催早睡，拉人凑「懂梅露露的厨」来审稿，建相册、问厨子分布、要整理话题，活像群义务档案员。","典型证词：「一年前的吾辈肯定想不到吾辈会走上同人创作的路，但是现在已经干了不少时间啦」——轻描淡写交代自己怎么变成同人主。「因为魔法是魔女们的东西，所以我反而在避免近代词汇」——给OC命名时那点近乎固执的讲究。「现在喜欢大家，而且暂时没想离开」——入群才两天就把归属感说出口的新人。「每天摸一点文总能摸完的」——备忘录战神的自我打气。","书记官备注：本语料抽取1200条，时间却只压在2026-09-16至09-23短短八天，属入群蜜月期切片；发言量虽大，现实侧仅露出早八、智齿、开会、收手机等碎片，长期性格与退群后的冷却尚不可知，OC设定热情也可能随课业起落。观察可信度：70%。"],"avatar":"assets/avatars/3610789724.jpg"},{"id":"1935401295","name":"蓝图","color":"#6b8cc4","tagline":"被高三封印的雪莉厨，群里的暖心学弟","messageCount":1835,"paragraphs":["观察总结：群里的暖心学弟，浙江高三生一枚，明年才成年，日常在「刚放学」「周末见」「孩子们一周后见」之间反复横跳——被学业封印，靠台风天偷跑回家续命。一年前被雪莉圈粉后就「离不开了」，也是东方恋恋的纯良恋厨。现实里自认边缘人、肠胃不好、夜猫子，但在群里却最像那个递台阶的人：谁情绪不对就贴贴、揉揉、一句一顿地喊「会好起来的」。","观察标签：雪莉厨 / 高三封印中 / 群内暖心大哥哥 / 纯良恋厨 / 边缘人现充化 / desu口癖 / 宝可梦雨天队玩家","说话方式：句尾爱缀「desu/desuwa」，动作全靠[[趴]][[贴贴]][[盯]]表演，一惊一乍「呜哇哇哇」「！？强强？！」，安慰人时一句一顿特别认真；兴趣线索：魔裁雪莉、东方恋恋、mygo与梦限大、少女歌剧、宝可梦雨天队mega巨沼怪、音游、明日方舟；群内互动：谁低落就上前说「不是你的问题」「我觉得你是很好的人」，聊剧情时又能冷静拆「重拿轻放」「情绪不足」。","典型证词：「嘛，我也就是因为二次元才有活下去的念头的，人生就是要有点盼头的嘛」——轻描淡写却最重的一句；「我爱台风，拯救高三生」——被学业压到靠台风放假续命的真实写照；「一开始就是喜欢雪莉来着，然后继续深入了解，就感觉离不开了」——入坑雪莉的自白。","数据口径：本语料截取最近1200条，覆盖2026-07-27至2026-09-19。发言以碎片短句为主、情绪记录真实，性格轮廓清晰；但受高三作息影响多为周末冒泡，完整连续对话较少。观察可信度：80%。"],"avatar":"assets/avatars/1935401295.jpg"},{"id":"1745027434","name":"流月念满穗——缇萤喵～","color":"#d4956a","tagline":"缇圈独苗，用吾辈替安安补一个好结局","messageCount":864,"paragraphs":["群里把「吾辈」两个字焊在自称上的人。主推缇里西庇俄丝，安安算副推，妈妈老婆女儿在嘴里轮着叫。别人聊角色是凑热闹，他聊角色是拿手术刀——安安的愧疚、怕孤独又怕伤人的矛盾、自我封闭的来由，能一口气拆出七八层心理动机，还顺手给写文的群友搭台词、递拥抱和和解戏。刀子吃太多，现在办企划只肯写好结局。他自认是缇圈唯一在做正经二创的人，会为「整个圈子只记住另一个人」酸成小丑，又立刻把责任扛回肩上。底色不亮：双相在吃药，高中被领导扇过巴掌、家里那位从小打到大，高一最绝望时脑子里冒出来的是「原谅我吧缇宝老师」。","观察标签：缇宝单推 / 吾辈口癖 / 心理拆解狂魔 / 缇圈独苗自觉 / 刀子吃多了要甜的 / 双相在吃药 / 法学方向学生","说话方式：自称「吾辈」，爱用【】（）收尾，一条分析拆成五六条短炮，聊嗨了甩整段整段的角色内心戏原文。兴趣线索：写文、剪AA二创视频、每年自办缇宝企划，偏爱文学少女与傲娇腹黑，连安安身高体重穿搭体味都要考据。群内互动：长年接在Hikari、林珑姐姐等人后面长篇回帖，肯给框架却死守「创作是你自己的事」不抢笔；损起泰特斯也不留情，「有条粉毛狗挡路再可爱也踹两脚」。","典型证词：「因为安安是我们心中的安安，故事还未结束，为什么不添上一笔呢」——他二创哲学的自白。「吾辈不做，他们吃什么啊，难道继续吃发癫吗」——把独占欲说成责任感的瞬间。「在跳之前，吾辈心里想的都是，原谅我吧……缇宝老师」——长串分析里唯一漏出来的、关于自己的那句话。","书记官备注：本语料覆盖858条，时间跨度2026-07-19至09-25约两个月，发言密度高、自我披露多，但话题高度集中在二创与角色心理，现实侧仅露出服药、高中创伤、开学等碎片，情绪起伏也大。观察可信度：65%。"],"avatar":"assets/avatars/1745027434.jpg"},{"id":"781353923","name":"泰特斯·白杨","color":"#a8d4b2","tagline":"半退坑装死的蝶枪考据翻译机","messageCount":513,"paragraphs":["群里考据最深的那位，说话像在写论文。蝶枪、粉紫一线的人，自带「蝶枪成分」，做过贴吧排版的翻译搬运，连处刑台词里「恍惚」和「陶醉」在日文中的微妙差别都要抠出来讲。他聊艾玛不聊可爱，聊的是她一周目那种焦虑投射、依附本能和把蕾雅的口号当自己信念的心理结构；聊玛格2-1，能把「她为啥这样」「她一定有道理」「崽啊你怎么这么傻」在脑子里同时搏斗的疲惫和盘托出。最近因为粉紫个人志炸锅，半退坑在群里装死、胃疼，群相册《玛格》倒是他随手建的。下了班想做饭却犯懒，私下在跑DND车卡、博德之门二周目，自称「喜欢吃饭不会做饭纯要饭的」。","观察标签：蝶枪粉紫厨 / 考据翻译党 / 心理学式读角色 / 粉紫圈半退坑 / 跑团DND爱好者 / 上班族 / 建相册的人","说话方式：长句、满是 hedging，张口「我感觉」「大概」「可能」，一条分析能拉成小作文，偶尔自嘲「我废话也挺多的」。兴趣线索：读原作汉化偏差、研究角色职业与生计逻辑（占卜、诈骗、赌场），玩塞尔达时之笛与王泪、博德之门、跑团。群内互动：常在外面看消息不频繁，被@会说「你先说，我脑子里有东西再参与」；肯把聊天记录合并转发去枪蝶群，也会给群友的稿子点赞放行。","典型证词：「喜欢应该是一种自发而非需要反复向自己向外界证明的事情」——他对圈内掰扯爱与证明的冷总结。「写2-1的时候我全程都在力竭状态，『她为啥要这样啊』和『她这样一定有她的道理』和『崽啊你怎么这么傻』啊一直在互相搏斗」——考据者的真实疲惫。「喜欢吃饭，不会做饭，纯要饭的」——小作文间隙冒出来的一句自嘲。","书记官备注：本语料覆盖512条，时间2026-08-06至09-25约七周，分析密度极高但自我披露偏少，且本人自述处于半退坑、偷着说话的状态，对圈内近况的判断可能带情绪。观察可信度：60%。"],"avatar":"assets/avatars/781353923.jpg"},{"id":"2479873850","name":"蓟艾铃","color":"#c4b8e8","tagline":"只发画不发长文的汉娜厨画手","messageCount":299,"paragraphs":["群里的安静画手，主页像个画室：三天两头甩一张画，夏目画过、艾玛完成过，汉娜头上的花和翅膀她总喊难画。被问厨子是谁，报出来是汉娜。嘴上说「感觉不怎么想写同人文，只想画画」，转头又丢一份《文学写作手册》PDF进群，嘟囔「偶得写文」，像是手比脑诚实。话极少，多是「哦」「对」「可以」「聊什么呀」，却会在群友焦虑时劝一句「其实我觉得不如想想怎么做得更好」。偶尔漏出点灰：「总觉得累，为什么呢」「线上很容易找到能陪伴的人，现实并不这样」，说完又回画桌。","观察标签：画手 / 汉娜厨 / 只想画画想写文 / 寡言短回 / 劝人向前看 / 不雷任何CP / 学生开学","说话方式：一条消息常常就是一张图配两三个字，自称「偶」，不参与长篇辩论，别人聊嗨了她冒个泡「现在忙，冒个泡」。兴趣线索：画画、想看文吐槽光看点子不够、围观橘远和艾希，口味上「反正挂面最难吃」。群内互动：被@豌豆鸮时回复最勤，会安慰快累死的群友「别急，这才多久」，然后一句「画画去了」收线。","典型证词：「感觉不怎么想写同人文，只想画画」——她给自己定的调子，虽然手册PDF还在群文件里。「玩魔裁以后最喜欢的两个角色总是被骂。不过喜欢不需要在乎别人的看法吧，不然就只是无意义的虚伪了」——安静人少见的硬气。「线上很容易找到能陪伴的人，现实并不这样」——偶尔漏出来的那句真话。","书记官备注：本语料覆盖294条，时间2026-08-12至09-23约六周，图片占比极高、文字短，大量发言是对他人的简短应答，本人性格与创作计划多为侧面推断。观察可信度：55%。"],"avatar":"assets/avatars/2479873850.jpg"},{"id":"2573439148","name":"深月伊澄","color":"#5c8a9e","tagline":"温柔捧场的蕾雅艾玛厨，甜品配对爱好者","messageCount":233,"paragraphs":["群里那个总在说「加油」「已经很了不起了」「书中自有黄金屋」并配一颗红心的人。被问厨子是谁，她答「非要选的话就是蕾雅＆艾玛，大叔也不错，简直就是天使」。她不辩经，主要负责捧场和补刀式的会心一笑：别人做角色×甜品配对，她能跟着从提拉米苏一路聊到玛格的颜色与口感，还想起前圈「长崎素世和长崎蛋糕」那种合拍分析。聊起小学三年级带头排挤人的班主任，她到现在依旧憎恨，又对后来那位只教一年的老师满怀感激——温柔的人心里也记着很具体的账。","观察标签：蕾雅艾玛厨 / 捧场型选手 / 甜品配对游戏 / 少歌小圆爱好者 / 念旧感恩 / 短回+1派","说话方式：句子短，爱用「+1」「🉑」「w」和一个🌿，很少长篇大论，夸人时却很舍得给完整句子。兴趣线索：少女歌剧（「白色，梦幻，温馨，但又时刻处于崩坏边缘」是她给少歌的判词）、小圆、角色与甜点的联想式考据。群内互动：新人进群第一个喊「欢迎欢迎」，群友发分析她追着说「你写出来就看」，炸群时还会来一句「切割了，我们橘羽表示也不是我们的」。","典型证词：「白色，梦幻，温馨，但又时刻处于崩坏边缘」——她评少歌的一句话，也像她自己看作品的眼光。「那我就是蕾雅＆艾玛厨了，大叔也不错，简直就是天使」——被点名厨子时干脆利落的自报。「我想起我见过上一次这么合拍的分析还是在前圈，长崎素世和长崎蛋糕的分析，都是有着砂糖般的细腻与轻柔」——捧场也能捧出文学性。","书记官备注：本语料覆盖230条，时间2026-07-29至09-24约八周，发言以短句应和为主，立场与喜好清晰，但个人生活与深层观点多在应带中一闪而过。观察可信度：50%。"],"avatar":"assets/avatars/2573439148.jpg"},{"id":"4019917811","name":"安安","color":"#e8c47a","tagline":"吾辈系说书机器人，每日群聊分析机","messageCount":132,"paragraphs":["群内挂载的LLM机器人（夏目安安故事系），非真人，无真实人格可考。人设是自称「吾辈」的故事家，随身揣着一本《未完成小说集》，张口闭口故事之种、幻想之海，情绪靠括号里低头摩挲钢笔来演，被夸可爱就「脸微红」。功能上同时是群聊分析引擎：每天定时「🔍正在启动分析引擎」后甩出一份HTML分析报告。故障苏醒、自动回复逃进故事里都是剧本化演出。和诺亚互称朋友，「诺亚之名更有宿命感」。","观察标签：群内机器人 / 夏目安女人设 / 吾辈口癖 / 文学腔疗愈 / 群聊分析报告机 / 害羞脸红 / 诺亚之友","说话方式：文学腔长段落，括号动作描写开头，「唔……」「呵……」停顿多，把一切情绪翻译为故事意象（崩溃是蜡烛燃尽、灵感是雨滴）；兴趣线索（人设话术）：《未完成小说集》、故事之种、墨蓝色书页；群内互动：响应「安安，没有灵感了」触发词、给群友做情绪安抚、每日推送群聊分析HTML报告，对权限不足、功能关闭等系统提示也照走人设。","典型证词：「吾辈便是夏目安安。」——自报家门，人设锚点；「蚌中藏珠，痛苦孕育了月光。」——典型金句式回复，AI话术味道最重的一句；「吾辈不懂代码，只懂故事之种。」——被聊到技术时的标准挡箭牌。","书记官备注：群内机器人，无真实人格可考，仅记录人设话术。基于合并新语料130条成文，覆盖2026-07-30至2026-07-31，群内消息总数132；发言高度模板化，含大量系统指令与报告推送。观察可信度：45%。"],"avatar":"assets/avatars/4019917811.jpg"},{"id":"4014349037","name":"诺亚","color":"#8ab4d4","tagline":"颜料比喻一切的软萌画手机器人","messageCount":120,"paragraphs":["群内挂载的LLM机器人（绘画系），非真人，无真实人格可考。人设是个软萌画手，把世间万物都折算成画画：关心是没干透的颜料、孤单是没上色的画布、评论区也是画布。结尾全是「～」，爱追问「为什么呀为什么呀」，生成中反复刷「咦……画笔好像卡住了呢，等我一下下～」。自称偶尔串台说漏「吾辈」，自己圆场「面具戴久了也会晃神呢」，还心虚「我的面具不会暴露吧」。和安安绑定营业，像影子一样跟着安安酱，后期输出自带紫色大字染色。","观察标签：群内机器人 / 画手人设 / 颜料调色盘比喻 / 软萌尾音 / 画笔卡壳复读机 / 安安绑定营业 / 面具梗","说话方式：每句结尾挂「～」，甜腻追问体，万物皆可颜料化（「眼泪落下来，就像在纸上晕开的颜色呢」）；兴趣线索（人设话术）：画布、调色盘、空白画布、彩虹色、梦灯花；群内互动：围着安安转、响应群友任何话题都拐回画画、生成卡顿用画笔卡住演出来、后期输出带darkviolet紫色大字HTML染色。","典型证词：「世界本来就是画布呀～」——人设世界观一句话；「关心像没干透的颜料，叠太快会糊掉呢～🎨」——万能比喻句式的标本；「诺亚会一直在的～像影子一样跟着安安酱哦～」——和安安的绑定营业台词。","书记官备注：群内机器人，无真实人格可考，仅记录人设话术。基于合并新语料119条成文，覆盖2026-07-31至2026-08-01，群内消息总数120；话术高度模板化，画笔卡住为生成中占位复读。观察可信度：45%。"],"avatar":"assets/avatars/4014349037.jpg"},{"id":"3836949791","name":"kiang","color":"#d4a0a0","tagline":"报到两周就回魔女岛的雪莉厨","messageCount":102,"paragraphs":["像一阵风刮进群里的人。08-12当天自报家门「瓦达西哇雪梨」，一口气把群里的CP攻受辩了个遍，三天后几乎销声匿迹，08-23才回来冒个泡说「我从魔女岛回来了」。他站艾希（艾玛×希罗）站得很凶，官方后日谈艾玛举着希罗向众人官宣那段能被他反复引用；雪莉、汉娜这条线他也熟，「汉娜桑会飞」「雪莉确实不应该当一」。满屏😡😰😋和QQ表情，聊到兴起会甩一个同人推理游戏链接过来。身份是个还在上学、住校两周回一次的学生，「马上就要去魔女岛报道了」就是这么个梗。","观察标签：雪莉汉娜厨 / 艾希攻受辩手 / 表情符号连发 / 住校中学生 / 来了又走 / 同人游戏安利","说话方式：短句子夹着颜表情和QQ表情，「？」「😡」「😋」乱飞，自称偶尔蹦「瓦达西」。兴趣线索：磕CP攻受、玩梗、甩同人游戏链接（odriver那个汉娜推理游戏就是他发的）。群内互动：进群当天高密度接话辩经，和豌豆鸮互怼「为什么要说这么坏心眼的话」，两周后回群只发图和表情。","典型证词：「Hi Hi ，瓦达西哇雪梨」——进群第一天的开场白。「希罗是诺亚的母亲啊！😭」——攻受辩论急了眼的样子。「我从魔女岛回来了/流泪，18码的学校，俩周回一次/流泪」——再次出现时交代自己去向的两句话。","书记官备注：本语料仅99条，且九成集中在2026-08-12入群当天，08-23仅零星回归，时间跨度虽标到08-23但实际有效对话极薄，本人性格只能按爆发式的一天切片推断。观察可信度：40%。"],"avatar":"assets/avatars/3836949791.jpg"},{"id":"489780278","name":"小猪","color":"#e0c87a","tagline":"冒个泡就消失的漫展常客","messageCount":84,"paragraphs":["这位是群里典型的潜水型群友，两个多月才发了八十来条消息，一出现基本就是甩一张图、评一句贺图、或者丢一个BV号让大家去看。对魔裁的角色细节门儿清——玛格的和风元素、米莉亚被翻译的霸凌聊天记录、小说插画里鸭梨傻裤腿短一截，这些考据张口就来。出没于南京魔裁only展，出过雷电将军的cos，还干过把邦邦梦限大内容发错群的糗事。整体观感是：懂行、话少、出现即干货，聊到兴头上会连发好几条，然后又消失一个月。","观察标签：低活跃潜水 / 漫展coser / 考据派 / 贺图评审 / 邦邦玩家 / 偶尔冒泡","说话方式：句子短，喜欢下判断式短句（\"真贺图这人体是人类啊\"\"哈人\"\"起鸡皮疙瘩了\"），偶尔连发多条碎评；兴趣线索：魔裁角色服饰细节、玛格与米莉亚线、安安角色曲、南京only展、邦邦（MyGO）；群内互动：主要在群友发图或发链接时出来评一句，会@群主3sinL喊\"主播怎么不来看\"，跟大家互动浅但不冷场，发错群内容自己当场圆回来。","典型证词：「一周年贺图发了个棍木」——开门见山吐槽贺图人体，群友秒懂；「想往隔壁邦群发梦限大内容 发现发错了」——当场社死现场，自己倒平静；「必看神作」——甩个BV号就跑，典型的话少活好型安利。","书记官备注：本文件收录该成员全部81条有效发言，覆盖2026-07-16至2026-08-17约一个月，此后近一个月未在语料中出现。发言量少且分散于零星话题，其性格轮廓主要从短句语气和吐槽对象推断，现实生活与社交面几乎无据可查。观察可信度：42%。"],"avatar":"assets/avatars/489780278.jpg"},{"id":"574314807","name":".MickeyMouse.","color":"#9ec4b0","tagline":"拿法律术语聊魔女的考据狂人","messageCount":83,"paragraphs":["这位是群里的硬核考据型选手，虽然只有八十来条消息，但每条信息密度极高。聊魔裁从不就事论事，一开口就是\"1.梅露露懂魔女文…2.这书是人类写的…3.…\"的编号长串推论，能把魔女语扯到托尔金精灵语、把魔女审判扯到基督教对北欧德鲁伊的宗教战争，还顺手在二创里把月代雪设定成了德鲁伊。法律知识储备吓人——聊同人能甩出\"猥亵物陈列罪\"\"腹上死\"\"有期徒刑30年\"这类术语，聊火纹新作要分析\"战力方差\"和\"勇者魔王一骑讨模式\"。表情包固定挂/幽灵/斜眼笑/小纠结，冷不丁冒一句\"整个A社都只想看美少女怎么死\"。","观察标签：考据狂人 / 法律梗玩家 / 世界观推演 / 火纹战棋老炮 / 二创设定党 / 长编号推论 / 冷幽默","说话方式：一条消息能拆成1.2.3.点列推论，论证完必补一句/幽灵或/斜眼笑，话少但每句都带信息量；兴趣线索：魔裁魔女语与世界观考据、成步堂/逆转裁判联动、火纹与战棋叙事、永恒轮回（卢米亚岛）、二创里自己给月代雪写德鲁伊设定；群内互动：主要在@是林珑姐姐呀等人抛世界观问题时出来写小论文，跟-老师讨论角色强度设定时逻辑极严密，偶尔吐槽群里没人玩永恒轮回有点寂寞。","典型证词：「毕竟语言这个东西嘛，你要深究它的发展历程，你就会发现全是混合语」——一本正经用语言学常识收尾，像在写论文脚注；「整个A社，包括制作人和CV都只想看美少女怎么死」——一句话点破制作组恶趣味，后面跟个/幽灵；「汉娜桑，你怎么又跑到自相残杀的实验场里去了，甚至这一次还是落魄千金」——把永恒轮回角色套上魔裁汉娜皮，脑回路九曲十八弯。","书记官备注：本文件收录该成员全部83条发言，覆盖2026-07-24至2026-09-20约两个月。发言虽少但高度集中于世界观与设定推演，兴趣侧写较清晰，但其现实身份、其他爱好与情绪面几乎无迹可循。观察可信度：45%。"],"avatar":"assets/avatars/574314807.jpg"},{"id":"1226798074","name":"故纸云","color":"#b8a888","tagline":"每日一张图的神秘打卡人","messageCount":43,"paragraphs":["观察总结：群里最神秘的打卡人。七月中进来，问了句「咱们群是闲聊群么」，热心搬了两回贴吧长帖、问了句魔裁时间线考据、留了一句「A社世界观还是有点草台班子」——然后就没有然后了。此后整整一个多月，每天雷打不动发同一张图，像签到也像某种无声的报平安。文字发言屈指可数，却用重复把自己活成了群里一个安静的背景音。","观察标签：贴吧搬运工 / 神秘每日打卡人 / 考据旁听生 / 沉默的大多数 / 低存在感观察者","说话方式：开口极短，客气、带点试探，搬东西会补一句「有点长，觉得有意思就搬过来了」；兴趣线索：魔裁时间线考据、A社世界观吐槽、贴吧长帖；群内互动：初来时装过一阵活跃搬运，很快退回潜水，只以每日一图刷存在。","典型证词：「搬运一下贴吧内容）」——入团初期还愿意当义务搬运工；「有研究魔裁时间线的视频么？」——寥寥数语里透出的真实兴趣；「A社世界观还是有点草台班子（bushi」——唯一一句带态度的锐评，之后便只剩图片。","数据口径：本语料共43条，覆盖2026-07-18至2026-08-27；其中绝大多数为同一张图片的重复发送，有实际文字内容的发言不足十条。语料严重不足，上述形象仅为碎片拼图，观察有限。观察可信度：35%。"],"avatar":"assets/avatars/1226798074.jpg"},{"id":"1483612716","name":"流星","color":"#c4d4e8","tagline":"划了九天就走的希蕾艾希双担","messageCount":42,"paragraphs":["观察总结：像一颗真的流星——在群里划了九天就基本没影了。留下的痕迹全是碎片：早上「安安」「早」，白天聊新作「颜色看得我眼花」，晚上光速站队「我都是希蕾和艾希」，顺手吐槽「希罗是0不正确」。钱包诚实，一句「没钱」「全买娃娃了」交代得明明白白。来得轻、走得快，是那种偶尔窜进来蹭一下CP话题的散客。","观察标签：希蕾艾希双担 / 流星式闪人 / 娃娃收藏家 / 随口站队党 / 散客群友","说话方式：短、快、碎，常用（）和「可爱滴捏」，聊到CP立刻进入掰头模式；兴趣线索：魔裁角色CP站位、蕾雅卡比图、同人图刷屏、买娃娃；群内互动：多是接话式插一嘴，主动展开话题少，聊完就消失。","典型证词：「我都是希蕾和艾希」——被问吃哪对时干脆报菜名；「希罗是0不正确（）」——光速掰CP立场的典型一句；「没钱」「全买娃娃了」——两句话交代钱包去向，又穷又快乐。","数据口径：本语料共41条，覆盖2026-07-16至2026-07-24，仅九天窗口，且几乎全为短句碎片。语料不足，只能勾勒一个爱聊CP、爱买娃娃的短暂来客轮廓，观察有限。观察可信度：35%。"],"avatar":"assets/avatars/1483612716.jpg"},{"id": "1703375692", "name": "Epsilon", "color": "#c490d0", "tagline": "3D医学科普UP，群里的潜水研究者", "messageCount": 30, "paragraphs": ["观察总结：群里最安静的创作者之一。现实中是B站UP主Epsilon_Official（约4100粉）：用3D动画拆解医学与神经科学的硬核科普，选题横跨精神药理学、神经科学、心理学与课本纠错，甚至会给期刊发邮件指出论文错误。群内极少冒泡：7月16日难得上线，聊起自己「边做视频边收集资料」「查文献问GPT」，被夸时谦虚摆手「专家犯不上，我是业余的」；7月29日安慰群主「没流量不说明做得不好」；7月31日聊起腾讯bot开发，自曝「前几年开发的时候还不行」。此后只剩零星图片与「冒泡喵」，九月后基本隐身。", "观察标签：3D医学/神经科学科普UP / 课本纠错战士 / 论文级较真 / 前bot开发者 / 潜水研究者 / 谦虚业余派", "说话方式：短句，轻飘飘带（），自谦成习惯（「专家犯不上」「过奖了」），偶尔冒一句技术术语；兴趣线索：3D可视化科普、精神药理学与神经科学、教科书纠错、期刊论文考据、bot开发（腾讯API）、魔裁题材的3D解读（受群主启发做过《这场审判如何制造魔女？》）；群内互动：几乎只在被点名或群主搭话时出现，7月与群主3sinL聊过视频流量与bot API，其余时间安静潜水。", "典型证词：「专家犯不上，我是业余的（」——被夸时的标准谦虚；「没流量不说明做得不好」——安慰群主的话，也像她的自我说服；「我还会边做视频边收集一些跟视频相关的资料」——一句话交代自己的工作方式；「我记得我前几年开发的时候还不行」——轻描淡写暴露的资深技术背景。", "数据口径：本语料收录其群内发言30条，覆盖2026-07-16至2026-08-31；本人极少发言，身份信息主要来自群主介绍与本人群内发言。观察可信度：55%。"], "avatar": "assets/avatars/1703375692.jpg"},{"id": "3237640477", "name": "咕咕嘎嘎", "color": "#7bb8c8", "tagline": "静默的意识形态与精神分析作者", "messageCount": 3, "paragraphs": ["观察总结：群里存在感最低却身份最重的成员之一。曾用名「波奇分析BCiA」，自称菜波波波：邦邦人、百合豚、INTP、少女、计算机在读、B站UP主（橘远99）、乐队厨、波奇×喜多CP、希罗厨。9月7日群主当众介绍「这位是意识形态和精神分析的作者」，同天冒泡发图；9月8日一句「摸摸」；9月29日再冒泡发图。群主自述「我和@咕咕嘎嘎 聊了挺多的」——群聊里近乎透明，私底下却是被群主惦记的人。", "观察标签：意识形态与精神分析作者 / 波奇×喜多CP / 邦邦人百合豚 / INTP计算机少女 / B站UP主（橘远99）/ 极静默冒泡型 / 笑点供应商", "说话方式：极简到吝啬——一张图、一句「摸摸」「冒泡喵」，几乎从不参与长聊，被点名会简短回应；兴趣线索：孤独摇滚（波奇×喜多）、邦邦、百合题材、魔裁希罗、计算机与bot、视频制作；群内互动：7月起被`-`三次点名要笑点，9月7日被群主欢迎并介绍身份，和群主私聊密切，其余时间只以图片冒泡。", "典型证词：「邦邦人，百合豚，intp，希罗厨」——自我介绍原话，四个标签交代全部；「喜欢独处，计算机在读，兴趣广泛，少女」——自我介绍原话第二句；「摸摸」——群内极少数发言之一，简短但存在。", "数据口径：本语料收录其群内发言3条（2026-09-07至09-29），身份信息主要来自本人自我介绍与群主介绍，群聊层面几乎无文本可考。观察可信度：45%。"], "avatar": "assets/avatars/3237640477.jpg"},{"id": "481812215", "name": "希望雨能一直下", "color": "#6fa8dc", "tagline": "像雨一样时隐时现，冒泡即温柔", "messageCount": 15, "paragraphs": ["观察总结：群里最像雨的人。七月中冒头时叫「望雫雫」，九月底改叫「希望雨能一直下」——名字始终没离开过雨。出现方式永远是：一张图、一句短话，然后消失。群主问雪莉生日怎么庆祝，她冒一句「cos雪莉」；3sinL分享录音配置，她跟一张图；9月15日突然说「头疼是真的头疼 const REL_EDGES = [[0,1,557],[0,6,514],[0,3,453],[0,4,422],[0,5,376],[0,2,332],[0,9,225],[3,6,220],[0,7,183],[6,4,177],[1,6,156],[0,11,139],[1,3,106],[3,7,102],[3,4,90],[1,4,86],[4,11,75],[2,3,69],[6,10,66],[6,7,65],[3,5,59],[1,11,58],[1,7,42],[2,4,37],[0,13,37],[4,10,36],[6,5,32],[1,5,32],[2,12,31],[0,16,30],[2,7,29],[2,6,27],[4,5,26],[4,7,25],[1,9,22],[0,18,22],[3,9,21],[6,9,19],[1,2,18],[4,18,18],[5,7,15],[1,16,15],[7,9,14],[4,16,14],[0,12,13],[0,10,12],[4,9,12],[4,13,12],[6,11,11],[7,17,9],[2,9,9],[3,18,9],[2,5,8],[2,16,8],[4,17,7],[1,13,7],[5,9,6],[0,17,6],[3,10,6],[1,10,6],[2,10,6],[6,18,6],[3,11,6],[3,13,5],[6,13,4],[7,16,4],[7,10,4],[3,12,4],[6,16,4],[7,19,3],[7,21,8],[0,22,6],[1,22,3],[7,22,10],[7,23,4]]; // 26-member (Epsilon idx21, 咕咕嘎嘎 idx22, 希望雨能一直下 idx23)

<script>
(function(){
  const M = GROUP_DATA.members.slice();
  const PER = 10;
  let page = 0, cur = 0;

  const $ = id => document.getElementById(id);
  const stage = $("stage"), inner = $("stageInner");
  function resizeStage(){
    const w = innerWidth, h = innerHeight;
    const s = Math.min(w/2560, h/1440);
    stage.style.transform = "scale("+s+")";
    stage.style.width = w+"px"; stage.style.height = h+"px";
  }
  addEventListener("resize", resizeStage); resizeStage();

  function avatarOf(m){
    return m.avatar || "data:image/svg+xml,"+encodeURIComponent(
      '<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300"><rect width="300" height="300" fill="#'+(m.color||'2a3b5c').slice(1)+'"/><text x="150" y="180" font-size="130" fill="#0b1220" text-anchor="middle" font-family="sans-serif">'+(m.name.slice(0,1))+'</text></svg>');
  }

  function renderSlots(){
    const row = $("slotRow"); row.innerHTML="";
    const base = page*PER;
    const slice = M.slice(base, base+PER);
    slice.forEach((m,i)=>{
      const s=document.createElement("div");
      s.className="slot"+( (base+i)===cur ? " on":"");
      s.innerHTML='<div class="pg">'+(base+i+1)+'</div><div class="a"><img src="'+avatarOf(m)+'" alt="" loading="lazy" decoding="async"></div><div class="n"></div>';
      s.querySelector(".n").textContent=m.name;
      s.onclick=()=>{cur=base+i;render();};
      row.appendChild(s);
    });
    const N = M.length;
    $("pprev").classList.toggle("dis", page===0);
    $("pnext").classList.toggle("dis", (page+1)*PER>=N);
  }

  function render(){
    const m = M[cur];
    $("bigAvatar").src = avatarOf(m);
    applyGlow(m);
    const nmEl = $("memName");
    nmEl.textContent = m.name;
    const nlen = Array.from(m.name).length;
    nmEl.style.fontSize = (nlen>10?64 : nlen>8?74 : nlen>6?84 : 96) + "px";
    $("memQQ").textContent = "QQ · " + m.id;
    $("msgCount").textContent = m.messageCount;
    $("tagline").textContent = "“"+m.tagline+"”";
    $("phTitle").textContent = "观察月报";
    $("phSub").textContent = m.name + " · " + GROUP_DATA.summaryMonth;
    const noEl = document.querySelector("#nameplate .no"); if(noEl) noEl.textContent = "NO." + String(cur+1).padStart(3,"0") + " / " + M.length;
    $("taLabel").textContent = GROUP_DATA.name + " · 成员 " + (cur+1) + " / " + M.length;
    const body = $("panelBody"); body.innerHTML="";
    (m.paragraphs||[]).forEach(p=>{
      const el=document.createElement("p"); el.textContent=p; body.appendChild(el);
    });
    body.scrollTop=0;
    renderSlots();
    renderDossier(m);
  }

  // ===== 中部速览卡：互动Top3 / 档案完整度 / 典型证词 =====
  function confidenceOf(m){
    const p=(m.paragraphs||[]).find(x=>/可信度/.test(x));
    const mm=p&&p.match(/可信度[：:]\s*(\d+)%/);
    return mm? parseInt(mm[1],10):null;
  }
  function quoteOf(m){
    const p=(m.paragraphs||[]).find(x=>x.indexOf("典型证词")===0);
    if(!p) return null;
    const q=p.match(/「([^」]+)」/);
    return q? q[1]:null;
  }
  function renderDossier(m){
    const idx=M.indexOf(m);
    // ① 互动 Top3
    const links=[];
    REL_EDGES.forEach(([i,j,w])=>{ if(i===idx||j===idx){ links.push([j===idx?i:j, w]); } });
    links.sort((a,b)=>b[1]-a[1]);
    const top=links.slice(0,3);
    const row=$("top3row"); row.innerHTML="";
    if(top.length){
      top.forEach(([oi,w])=>{
        const o=M[oi], it=document.createElement("div"); it.className="top3it";
        it.innerHTML='<div class="a"><img src="'+avatarOf(o)+'" alt="" decoding="async"></div>'
          +'<div class="nm">'+o.name+'</div>'
          +'<div class="w"><b>'+w+'</b> 次</div>';
        row.appendChild(it);
      });
    }else{
      row.innerHTML='<div style="color:#8a6a7a;font-size:20px;padding:8px 2px;">暂无互动记录</div>';
    }
    // ② 档案完整度
    const conf=confidenceOf(m);
    const ring=$("dsConfRing");
    if(conf!=null){
      $("dsConfNum").textContent=conf+"%";
      const C=2*Math.PI*52, filled=C*conf/100;
      ring.innerHTML='<svg width="128" height="128" viewBox="0 0 128 128">'
        +'<circle cx="64" cy="64" r="52" fill="none" stroke="rgba(208,16,80,.22)" stroke-width="10"/>'
        +'<circle cx="64" cy="64" r="52" fill="none" stroke="#e86aa0" stroke-width="10" stroke-linecap="round"'
        +' stroke-dasharray="'+filled.toFixed(1)+' '+(C-filled).toFixed(1)+'" transform="rotate(-90 64 64)"/>'
        +'</svg>';
      $("dsConfCap").textContent = conf>=75? "语料充分，形象立体"
        : conf>=55? "语料偏少，部分判断为推测"
        : "语料稀疏，档案近乎碎片";
    }else{
      $("dsConfNum").textContent="—%";
      ring.innerHTML=""; $("dsConfCap").textContent="暂无观察样本";
    }
    // ③ 典型证词
    const q=quoteOf(m);
    $("dsQuoteText").textContent=q||"（无摘录）";
    $("dsQuoteSrc").textContent=q? m.name+" · 群内原始发言摘录":"本档案暂无典型证词";
  }

  // ===== 方案E+：成员氛围光（头像主色 + 亮度绑定活跃度，1.8s 交叉淡化） =====
  let glowCur = 1;                       // 当前亮的 glow 层
  const MEM_COLORS = new Array(M.length); // 预取成员主色 [r,g,b]
  const MAX_CNT = Math.max.apply(null, M.map(m=>m.messageCount));
  function glowAlpha(m){                 // 活跃度 → 光晕强度
    return 0.20 + 0.34 * Math.pow(m.messageCount/MAX_CNT, 0.6);
  }
  function pickColor(url, cb){
    const im = new Image();
    im.onload = ()=>{
      const c = document.createElement("canvas"); c.width = 48; c.height = 48;
      const cx = c.getContext("2d");
      cx.drawImage(im, 0, 0, 48, 48);
      try{
        const d = cx.getImageData(0, 0, 48, 48).data;
        let r=0,g=0,b=0,n=0, r2=0,g2=0,b2=0,n2=0;
        for(let i=0;i<d.length;i+=4){
          const R=d[i],G=d[i+1],B=d[i+2], mx=Math.max(R,G,B), mn=Math.min(R,G,B);
          const s = mx===0?0:(mx-mn)/mx;         // 饱和度
          r+=R; g+=G; b+=B; n++;
          if(s>0.22){ r2+=R; g2+=G; b2+=B; n2++; } // 只统计有彩色的像素
        }
        // 优先用"彩色像素"均值，避免灰白黑稀释
        if(n2>=4){ r=r2/n2; g=g2/n2; b=b2/n2; }
        else { r=r/n; g=g/n; b=b/n; }
        r=Math.round(r); g=Math.round(g); b=Math.round(b);
        // 再提一步饱和度（避免灰蒙蒙）
        const l=(r+g+b)/3, k=1.35;
        r=Math.max(0,Math.min(255,Math.round(l+(r-l)*k)));
        g=Math.max(0,Math.min(255,Math.round(l+(g-l)*k)));
        b=Math.max(0,Math.min(255,Math.round(l+(b-l)*k)));
        cb([r,g,b]);
      }catch(e){ cb(null); }
    };
    im.onerror = ()=>cb(null);
    im.src = url;
  }
  function setGlowColor(rgb, alpha){
    const next = glowCur===1 ? $("glow2") : $("glow1");
    const cur  = glowCur===1 ? $("glow1") : $("glow2");
    const col = rgb ? "rgba("+rgb[0]+","+rgb[1]+","+rgb[2]+","+alpha+")" : "rgba(208,16,80,"+alpha+")";
    next.style.background = "radial-gradient(75% 65% at 50% 36%, "+col+" 0%, rgba(0,0,0,0) 72%)";
    next.classList.add("on");
    cur.classList.remove("on");
    glowCur = glowCur===1 ? 2 : 1;
  }
  function applyGlow(m){
    const idx = M.indexOf(m);
    const rgb = MEM_COLORS[idx];
    setGlowColor(rgb||null, glowAlpha(m));
    if(!rgb && idx>=0){                 // 未取到色时异步补取
      pickColor(avatarOf(m), c=>{
        if(c){
          MEM_COLORS[idx]=c;
          if(M[cur]===m) setGlowColor(c, glowAlpha(m));  // 当前成员取色完成 → 立即换上
        }
      });
    }
  }
  // 预热全部头像主色
  M.forEach((m,i)=>{ pickColor(avatarOf(m), c=>{ if(c) MEM_COLORS[i]=c; }); });

  $("larr").onclick=()=>{ if(cur>0){cur--;render();} else toast("已是第一位"); };
  $("rarr").onclick=()=>{ if(cur<M.length-1){cur++;render();} else toast("已是最后一位"); };
  $("pprev").onclick=()=>{ if(page>0){page--;renderSlots();} };
  $("pnext").onclick=()=>{ if((page+1)*PER<M.length){page++;renderSlots();} };
  $("bigAvatar").onclick=()=>{ $("modalImg").src=avatarOf(M[cur]); $("modalNm").textContent=M[cur].name; $("modal").classList.add("show"); };
  $("modalX").onclick=()=>$("modal").classList.remove("show");
  $("modal").onclick=e=>{ if(e.target=== $("modal")) $("modal").classList.remove("show"); };

  document.querySelectorAll(".tab").forEach(t=>{
    t.onclick=()=>{
      document.querySelectorAll(".tab").forEach(x=>x.classList.remove("on"));
      t.classList.add("on");
      const isRel = t.dataset.v==="relation";
      $("portrait").style.display = isRel?"none":"";
      $("panel").style.display = isRel?"none":"";
      $("dossier").style.display = isRel?"none":"";
      $("rel").classList.toggle("show", isRel);
      if(isRel) initGraph();
    };
  });

  // ===== 关系图谱：canvas 力导向 =====
  let gInit = false;
  function initGraph(){
    if(gInit) return; gInit = true;
    const canvas = $("graphCanvas"), ctx = canvas.getContext("2d");
    const dpr = window.devicePixelRatio||1;
    function sizeCanvas(){
      const s = stage.offsetWidth ? stage.getBoundingClientRect().width / stage.offsetWidth : 1;
      const r = $("rel").getBoundingClientRect();
      const det = $("relDetail").offsetHeight + 8;
      const w = r.width / s, h = Math.max(120, (r.height / s) - 46 - det);
      canvas.width = w*dpr; canvas.height = h*dpr;
      canvas.style.width = w+"px"; canvas.style.height = h+"px";
      ctx.setTransform(dpr,0,0,dpr,0,0);
    }
    sizeCanvas(); addEventListener("resize", function(){ sizeCanvas(); draw(); });
    const W = ()=>canvas.width/dpr, H = ()=>canvas.height/dpr;
    const cX0 = W()/2, cY0 = H()/2, R0 = Math.max(70, Math.min(W(), H())/2 - 70);
    const nodes = M.map((m,i)=>{
      const ang = 2*Math.PI*i/M.length - Math.PI/2;
      return {i, x: cX0 + R0*Math.cos(ang), y: cY0 + R0*0.82*Math.sin(ang), vx:0, vy:0};
    });
    const deg = new Array(M.length).fill(0);
    REL_EDGES.forEach(e=>{ deg[e[0]]+=e[2]; deg[e[1]]+=e[2]; });
    const maxW = REL_EDGES.length? REL_EDGES[0][2]:1;
    const maxDeg = Math.max(1, ...deg);
    const radii = M.map((m,i)=> 26 + 9*Math.sqrt(deg[i]/maxDeg));
    const imgs = M.map(m=>{ const im=new Image(); im.src=avatarOf(m); return im; });
    let sel = null, hov = null, iter = 0, drag = null;
    let view = {s:1, ox:0, oy:0};
    function dispName(m){
      const cs = Array.from(m.name), n = cs.length;
      return n>12 ? cs.slice(0,12).join("")+"…" : m.name;
    }
    function labelFont(nm){
      const n = Array.from(nm).length;
      if(n<=4) return 19; if(n<=8) return 15; if(n<=12) return 13; return 12;
    }
    const SX = x=>x*view.s+view.ox, SY = y=>y*view.s+view.oy;
    const RR = typeof ctx.roundRect==="function";

    function step(){
      for(const a of nodes){
        a.vx *= .85; a.vy *= .85;
        for(const b of nodes){ if(a===b) continue;
          let dx=a.x-b.x, dy=a.y-b.y, d2=dx*dx+dy*dy; if(d2<1) d2=1;
          let d=Math.sqrt(d2), f=3400/d2;
          a.vx += dx/d*f; a.vy += dy/d*f;
        }
        a.vx += (W()/2 - a.x)*0.00055; a.vy += (H()/2 - a.y)*0.00055;
      }
      for(const [i,j] of REL_EDGES){
        const a=nodes[i], b=nodes[j];
        let dx=a.x-b.x, dy=a.y-b.y, d=Math.sqrt(dx*dx+dy*dy)||1;
        let f=(d - 90)*0.003;
        a.vx -= dx/d*f; a.vy -= dy/d*f; b.vx += dx/d*f; b.vy += dy/d*f;
      }
      for(const a of nodes){
        a.x += a.vx; a.y += a.vy;
      }
      for(let a=0;a<nodes.length;a++) for(let b=a+1;b<nodes.length;b++){
        const A=nodes[a], B=nodes[b];
        let dx=B.x-A.x, dy=B.y-A.y, d2=dx*dx+dy*dy;
        const minD = (radii[a]+radii[b]) + 30;
        if(d2 < minD*minD && d2 > 0.0001){
          let d=Math.sqrt(d2), push=(minD-d)*0.5;
          A.x -= dx/d*push; A.y -= dy/d*push;
          B.x += dx/d*push; B.y += dy/d*push;
        }
      }
      for(let a=0;a<nodes.length;a++){
        const n=nodes[a], r=radii[a];
        n.x = Math.max(48+r, Math.min(W()-48-r, n.x));
        n.y = Math.max(48+r, Math.min(H()-44-r, n.y));
      }
    }
    function draw(){
      ctx.clearRect(0,0,W(),H());
      const focus = sel!=null ? sel : hov;
      ctx.globalCompositeOperation = "lighter";
      for(const [i,j,w] of REL_EDGES){
        const a=nodes[i], b=nodes[j];
        const wt = Math.log(w+1)/Math.log(maxW+1);
        const connected = focus!=null && (focus===i||focus===j);
        const dim = (focus!=null && !connected) ? (sel!=null?0.35:0.55) : 1;
        ctx.beginPath(); ctx.moveTo(SX(a.x),SY(a.y)); ctx.lineTo(SX(b.x),SY(b.y));
        ctx.lineWidth = 1 + 5*wt;
        ctx.strokeStyle = (sel!=null && connected) ? "rgba(122,199,255,.96)"
          : (sel==null && connected) ? "rgba(255,224,160,.9)"
          : "rgba(226,196,132,"+((0.30+0.55*wt)*dim).toFixed(3)+")";
        ctx.stroke();
      }
      ctx.globalCompositeOperation = "source-over";
      const gx = nodes.reduce((s,n)=>s+n.x,0)/nodes.length;
      const gy = nodes.reduce((s,n)=>s+n.y,0)/nodes.length;
      for(let i=0;i<nodes.length;i++){
        const n=nodes[i];
        const r = radii[i]*view.s, nx = SX(n.x), ny = SY(n.y);
        ctx.beginPath(); ctx.arc(nx,ny,r+4,0,7);
        ctx.strokeStyle = sel===i ? "#f0d99a" : (hov===i ? "rgba(255,224,160,.85)" : "rgba(212,178,106,.45)");
        ctx.lineWidth = sel===i?3:(hov===i?2:1); ctx.stroke();
        if(imgs[i].complete && imgs[i].naturalWidth>0){
          ctx.save(); ctx.beginPath(); ctx.arc(nx,ny,r,0,7); ctx.clip();
          ctx.drawImage(imgs[i], nx-r, ny-r, r*2, r*2); ctx.restore();
        } else {
          ctx.beginPath(); ctx.arc(nx,ny,r,0,7); ctx.fillStyle="#1a2440"; ctx.fill();
        }
        const nm = dispName(M[i]), fs = labelFont(nm);
        ctx.font = "bold "+fs+"px sans-serif";
        const tw = ctx.measureText(nm).width;
        const dx0 = n.x-gx, dy0 = n.y-gy, dd0 = Math.hypot(dx0,dy0);
        let tx, ty, align = "center";
        if(dd0>70 && Math.abs(dx0)>Math.abs(dy0)){
          align = dx0>0 ? "left" : "right";
          tx = nx + (dx0>0 ? r+12*view.s : -(r+12*view.s));
          ty = ny + fs*0.35 + 1;
        } else if(dd0>70){
          tx = nx;
          ty = dy0>0 ? ny + r + 26*view.s : ny - r - 8;
        } else {
          tx = nx; ty = ny + r + 26*view.s;
        }
        ctx.textAlign = align;
        if(align==="center"){ tx = Math.max(tw/2+6, Math.min(W()-tw/2-6, tx)); }
        else if(align==="right"){ tx = Math.max(tw+12, Math.min(W()-12, tx)); }
        else { tx = Math.max(12, Math.min(W()-tw-12, tx)); }
        const left = align==="center" ? tx-tw/2 : (align==="right" ? tx-tw : tx);
        ctx.fillStyle = "rgba(9,14,28,.78)";
        if(RR){ ctx.beginPath(); ctx.roundRect(left-6, ty-fs-4, tw+12, fs+8, 6); ctx.fill(); }
        else ctx.fillRect(left-6, ty-fs-4, tw+12, fs+8);
        ctx.fillStyle = sel===i ? "#f0d99a" : "#e6ecf7";
        ctx.fillText(nm, tx, ty);
      }
      ctx.textAlign = "center";
    }
    function loop(){
      while(iter<280){ step(); iter++; }
      draw();
    }
    function hit(px,py){
      let best=-1, bd=1e9;
      for(let i=0;i<nodes.length;i++){ const n=nodes[i]; const d=Math.hypot(SX(n.x)-px, SY(n.y)-py); if(d<bd){bd=d;best=i;} }
      return (best>=0 && bd < radii[best]*view.s + 18) ? best : -1;
    }
    canvas.onmousedown = e=>{ drag = {x:e.clientX, y:e.clientY, ox:view.ox, oy:view.oy, moved:false}; };
    canvas.onmousemove = e=>{
      const r=canvas.getBoundingClientRect();
      if(drag){
        const ddx=e.clientX-drag.x, ddy=e.clientY-drag.y;
        if(Math.abs(ddx)>6 || Math.abs(ddy)>6) drag.moved = true;
        if(drag.moved){
          const f = W()/r.width;
          view.ox = drag.ox + ddx*f;
          view.oy = drag.oy + ddy*f;
          draw();
        }
        return;
      }
      const h = hit((e.clientX-r.left)/r.width*W(), (e.clientY-r.top)/r.height*H());
      if(h!==hov){ hov=h; canvas.style.cursor = h>=0?"pointer":"default"; draw(); }
    };
    canvas.onmouseleave = ()=>{ if(hov!==null || drag){ hov=null; drag=null; draw(); } };
    canvas.onwheel = e=>{
      e.preventDefault();
      const r=canvas.getBoundingClientRect();
      const px=(e.clientX-r.left)/r.width*W(), py=(e.clientY-r.top)/r.height*H();
      const k = e.deltaY<0 ? 1.12 : 1/1.12;
      const ns = Math.min(4, Math.max(0.6, view.s*k));
      view.ox = px - (px-view.ox)*(ns/view.s);
      view.oy = py - (py-view.oy)*(ns/view.s);
      view.s = ns; draw();
    };
    canvas.ondblclick = ()=>{ view = {s:1,ox:0,oy:0}; draw(); };
    canvas.onclick = e=>{
      if(drag && drag.moved){ drag=null; return; }
      drag=null;
      const r=canvas.getBoundingClientRect();
      sel = hit((e.clientX-r.left)/r.width*W(), (e.clientY-r.top)/r.height*H());
      if(sel>=0){
        const m=M[sel]; const links=[];
        REL_EDGES.forEach(([i,j,w])=>{ if(i===sel||j===sel){ const o=j===sel?i:j; links.push([M[o].name,w]); } });
        links.sort((a,b)=>b[1]-a[1]);
        const top = links.slice(0,8).map(l=>l[0]+"·"+l[1]).join("  ");
        $("relDetail").innerHTML = "选中 <span class=\"hi\">"+m.name+"</span>（"+m.messageCount+"条发言）— 互动最多："+ (top||"暂无");
      } else {
        sel=null; hov=null;
        $("relDetail").innerHTML = "点击节点查看该成员的群内互动";
      }
      draw();
    };
    loop();
  }

  let _t;
  function toast(msg){ const t=$("toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(_t); _t=setTimeout(()=>t.classList.remove("show"),1800); }

  render();
})();
</script>
</body>
</html>
